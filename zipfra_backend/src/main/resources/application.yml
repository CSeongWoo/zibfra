spring:
  application:
    name: zipfra

  # 멀티 데이터소스 자동구성 비활성화 (§3) — Redis는 별도 자동 구성 허용 (단, Redis Repositories는 미사용이므로 제외)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # Redis (§10 — RT 저장 + AT Blacklist)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      repositories:
        enabled: false

  datasource:
    # primaryDataSource — MySQL (쓰기·인증)
    primary:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}
      pool-name: HikariPool-Primary
      maximum-pool-size: 10
      minimum-idle: 10 # (성능 최적화: max와 동일하게 설정 권장)

    # spatialDataSource — PostGIS (읽기·공간 분석)
    spatial:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB}
      username: ${PG_USER}
      password: ${PG_PASSWORD}
      pool-name: HikariPool-Spatial
      maximum-pool-size: 10
      minimum-idle: 10

# PUB-02 공공데이터 실시간 프록시 (§8.1) — 국토부 실거래가 OpenAPI
public-data:
  service-key: ${PUBLIC_DATA_SERVICE_KEY:}
  base-url: http://apis.data.go.kr/1613000
  # source → 엔드포인트 path 매핑(MOLIT_APT 확정, ROW/COMMERCE 는 신청 API 실제 endpoint 로 확정 필요)
  paths:
    MOLIT_APT: /RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade
    MOLIT_ROW: /RTMSDataSvcRHTrade/getRTMSDataSvcRHTrade
    COMMERCE: /RTMSDataSvcNrgTrade/getRTMSDataSvcNrgTrade

# 카카오 로컬 — 적재 시 지번주소 → 좌표 지오코딩(§9 실거래가 적재)
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  local-url: https://dapi.kakao.com/v2/local/search/address.json
  category-url: https://dapi.kakao.com/v2/local/search/category.json

# Zipfra 보안 설정 (§10)
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 1209600000
# MyBatis 설정
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# Logging
logging:
  level:
    com.example.zipfra: DEBUG
    com.zaxxer.hikari: INFO