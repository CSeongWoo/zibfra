spring:
  application:
    name: zipfra

  # 멀티 데이터소스 자동구성 비활성화 (§3) — Redis는 별도 자동 구성 허용 (단, Redis Repositories는 미사용이므로 제외)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # Redis (§10 — RT 저장 + AT Blacklist)
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      repositories:
        enabled: false

  # 이메일 전송 (비밀번호 찾기 인증번호 등)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    # primaryDataSource — MySQL (쓰기·인증)
    primary:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      username: ${MYSQL_USER}
      password: ${MYSQL_PASSWORD}
      pool-name: HikariPool-Primary
      maximum-pool-size: 10
      minimum-idle: 10 # (성능 최적화: max와 동일하게 설정 권장)

    # spatialDataSource — PostGIS (읽기·공간 분석)
    spatial:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB}
      username: ${PG_USER}
      password: ${PG_PASSWORD}
      pool-name: HikariPool-Spatial
      maximum-pool-size: 10
      minimum-idle: 10

  # Spring AI (AGENTS.md §3 확정 — gpt-4o-mini, RestTemplate 직접 호출 금지)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      # [CRITICAL] 공식 OpenAI가 아닌 SSAFY GMS 게이트웨이 서버로 API 라우팅을 강제합니다.
      base-url: ${OPENAI_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      chat:
        options:
          model: gpt-4o-mini          # AGENTS.md §6.2 확정 모델
          temperature: 0.3            # 사실 기반 요약 — 낮은 온도
          max-tokens: 400             # AI-02 출력 상한(AI-01은 서비스에서 300 오버라이드)
          timeout: 10000              # LLM 타임아웃 10s (§6.2 p95 < 10초)

# PUB-02 공공데이터 실시간 프록시 (§8.1) — 국토부 실거래가 OpenAPI
public-data:
  service-key: ${PUBLIC_DATA_SERVICE_KEY:}
  base-url: http://apis.data.go.kr/1613000
  # source → 엔드포인트 path 매핑. 실거래가 6종(아파트/오피스텔/연립다세대 × 매매/전월세).
  paths:
    MOLIT_APT: /RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade
    MOLIT_ROW: /RTMSDataSvcRHTrade/getRTMSDataSvcRHTrade
    COMMERCE: /RTMSDataSvcNrgTrade/getRTMSDataSvcNrgTrade
    APT_TRADE: /RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade
    APT_RENT: /RTMSDataSvcAptRent/getRTMSDataSvcAptRent
    OFFI_TRADE: /RTMSDataSvcOffiTrade/getRTMSDataSvcOffiTrade
    OFFI_RENT: /RTMSDataSvcOffiRent/getRTMSDataSvcOffiRent
    RH_TRADE: /RTMSDataSvcRHTrade/getRTMSDataSvcRHTrade
    RH_RENT: /RTMSDataSvcRHRent/getRTMSDataSvcRHRent

# 카카오 로컬 — 적재 시 지번주소 → 좌표 지오코딩(§9 실거래가 적재)
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  local-url: https://dapi.kakao.com/v2/local/search/address.json
  category-url: https://dapi.kakao.com/v2/local/search/category.json

# Zipfra 보안 설정 (§10)
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 1209600000
# MyBatis 설정
mybatis:
  configuration:
    map-underscore-to-camel-case: true

# AI 요약 쿼터 설정 (AGENTS.md §6.8)
ai:
  quota:
    daily-limit: 100  # 사용자 1인당 일일 AI 호출 상한 (LLM 단가 확정 후 재설정)
  summary:
    cache-ttl-hours: 24   # mysql_ai_summaries expires_at TTL (§6.3)

# Logging
logging:
  level:
    com.example.zipfra: DEBUG
    com.zaxxer.hikari: INFO
    org.springframework.ai: INFO