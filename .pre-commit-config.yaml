repos:
  - repo: local
    hooks:
      - id: spec-lint
        name: Spec Linter
        # 사용 중인 툴에 맞춰 명령어 수정 (예: npx @umxr/spec-lint, spectral lint 등)
        entry: npx spec-lint
        language: system
        # 타겟 파일 지정 (OpenAPI면 yaml/json, 마크다운이면 markdown)
        types: [yaml, json] 
        # 특정 폴더만 검사하고 싶다면 files 옵션 추가
        # files: ^docs/specs/